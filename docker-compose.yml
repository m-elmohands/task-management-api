version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_management_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - task_management
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: task_management_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - task_management
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: task_management_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - task_management

  redis:
    image: redis:alpine
    container_name: task_management_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - task_management

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_management_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./:/var/www
    networks:
      - task_management
    depends_on:
      - mysql
      - redis

networks:
  task_management:
    driver: bridge

volumes:
  mysql_data:
